[build]
  publish = "."
  command = "node build.js"

# Serve the homepage at the root and 301 the .html version to clean URL
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ── Legacy URLs from the prior site → closest current page ──
# (fixes Google "Not found (404)" + recovers any link equity)
